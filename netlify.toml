[build]
command = "next build"
publish = ".next"

[build.environment]
NODE_VERSION = "22"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Content-Type = "image/x-icon"

[[headers]]
  for = "/icon-192.png"
  [headers.values]
    Content-Type = "image/png"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/bimi/logo.svg"
  [headers.values]
    Content-Type = "image/svg+xml"
    X-Content-Type-Options = "nosniff"
    Access-Control-Allow-Origin = "*"
